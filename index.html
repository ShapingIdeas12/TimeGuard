    // POPUP MODAL: Check-In with Flexible Morning School Timing (8:30 / 9:00 / 9:30 AM), Shift Target & GPS Location
    function CheckInLocationModal({ employee, officeGeo, liveTime, onConfirm, onClose }) {
      const [customInTime, setCustomInTime] = useState(liveTime);
      const [shiftMode, setShiftMode] = useState('auto'); // 'auto', 'school_early', 'standard'
      const [selectedMode, setSelectedMode] = useState('Office'); // 'Office' or 'Field'
      const [notes, setNotes] = useState('');
      const [isDetecting, setIsDetecting] = useState(false);
      const [geoData, setGeoData] = useState(null);
      const [geoError, setGeoError] = useState('');

      // Dynamically calculate expected check-out time based on chosen check-in time
      const calculatedExpectedOut = useMemo(() => {
        const inM = parseTimeStr(customInTime);
        if (!inM) return '05:30 PM';
        if (shiftMode === 'school_early') {
          return '05:30 PM'; // Fixed school timing
        } else if (shiftMode === 'standard') {
          return '06:30 PM';
        } else {
          // Auto: If in <= 9:15 AM -> 5:30 PM; otherwise in + 510m (8.5 hrs)
          if (inM <= 555) {
            return '05:30 PM';
          }
          return formatMinutesToTimeStr(inM + 510);
        }
      }, [customInTime, shiftMode]);

      // Auto-fetch location on modal open (Pure browser client-side, zero backend!)
      const fetchLiveLocation = () => {
        if (!navigator.geolocation) {
          setGeoError('GPS Geolocation is not supported by this browser.');
          return;
        }

        setIsDetecting(true);
        setGeoError('');

        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            const accuracy = Math.round(pos.coords.accuracy);

            let areaName = `Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)}`;
            
            try {
              const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
              if (res.ok) {
                const data = await res.json();
                const parts = [data.locality || data.localityInfo?.administrative?.[3]?.name, data.city || data.principalSubdivision, data.countryName].filter(Boolean);
                if (parts.length > 0) {
                  areaName = parts.join(', ');
                }
              }
            } catch (err) {
              areaName = `GPS: ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            }

            const distance = calculateDistanceInMeters(lat, lon, officeGeo.lat, officeGeo.lon);
            const isVerifiedOffice = distance !== null && distance <= (officeGeo.radiusMeters || 250);

            setGeoData({
              latitude: lat,
              longitude: lon,
              accuracy,
              areaName,
              distanceMeters: distance,
              isVerifiedOffice,
              mapUrl: `https://maps.google.com/?q=${lat},${lon}`
            });
            setIsDetecting(false);
          },
          (err) => {
            setIsDetecting(false);
            if (err.code === 1) {
              setGeoError('Location permission denied. Please allow location access in your browser.');
            } else {
              setGeoError('Unable to retrieve GPS signal. Approximate coordinates used.');
            }
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      };

      useEffect(() => {
        fetchLiveLocation();
      }, []);

      const handleSubmit = () => {
        onConfirm(employee.id, {
          inTime: customInTime,
          expectedOutTime: calculatedExpectedOut,
          shiftMode: shiftMode,
          targetNetMins: 465, // 7h 45m
          workLocation: selectedMode,
          locationNote: notes.trim(),
          latitude: geoData ? geoData.latitude : null,
          longitude: geoData ? geoData.longitude : null,
          accuracy: geoData ? geoData.accuracy : null,
          areaName: geoData ? geoData.areaName : 'Standard Check-In',
          distanceMeters: geoData ? geoData.distanceMeters : null,
          isVerifiedOffice: geoData ? geoData.isVerifiedOffice : (selectedMode === 'Office'),
          mapUrl: geoData ? geoData.mapUrl : null
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm animate-fade-in overflow-y-auto">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-indigo-200 dark:border-indigo-900 my-8">
            {/* Header */}
            <div className="text-center pb-3 border-b border-slate-200 dark:border-slate-800">
              <div className={`w-14 h-14 rounded-2xl flex items-center justify-center font-bold text-lg mx-auto shadow-md mb-2 ${employee.avatarBg || 'bg-indigo-100 text-indigo-700'}`}>
                {employee.name.substring(0, 2).toUpperCase()}
              </div>
              <h3 className="text-xl font-extrabold text-slate-900 dark:text-white">
                Check-In: {employee.name}
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                Role: <span className="font-semibold text-slate-700 dark:text-slate-300">{employee.role}</span>
              </p>
            </div>

            {/* 1. MORNING ARRIVAL TIME & EARLY SCHOOL TIMING SELECTOR */}
            <div className="mt-4">
              <div className="flex items-center justify-between mb-1.5">
                <label className="text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider">
                  Morning Arrival Time:
                </label>
                <span className="text-[11px] font-mono font-bold text-indigo-600 dark:text-indigo-400">
                  {customInTime}
                </span>
              </div>

              {/* Quick Arrival Buttons */}
              <div className="grid grid-cols-4 gap-1.5 mb-2">
                <button
                  type="button"
                  onClick={() => setCustomInTime('08:30 AM')}
                  className={`py-1.5 px-1 rounded-xl text-xs font-mono font-bold transition-all border ${
                    customInTime === '08:30 AM'
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100'
                  }`}
                >
                  8:30 AM
                </button>

                <button
                  type="button"
                  onClick={() => setCustomInTime('09:00 AM')}
                  className={`py-1.5 px-1 rounded-xl text-xs font-mono font-bold transition-all border ${
                    customInTime === '09:00 AM'
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100'
                  }`}
                >
                  9:00 AM
                </button>

                <button
                  type="button"
                  onClick={() => setCustomInTime('09:30 AM')}
                  className={`py-1.5 px-1 rounded-xl text-xs font-mono font-bold transition-all border ${
                    customInTime === '09:30 AM'
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100'
                  }`}
                >
                  9:30 AM
                </button>

                <button
                  type="button"
                  onClick={() => setCustomInTime('10:00 AM')}
                  className={`py-1.5 px-1 rounded-xl text-xs font-mono font-bold transition-all border ${
                    customInTime === '10:00 AM'
                      ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                      : 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100'
                  }`}
                >
                  10:00 AM
                </button>
              </div>

              {/* Dynamic Target Checkout Preview Box */}
              <div className="p-2.5 rounded-xl bg-gradient-to-r from-indigo-50 to-purple-50 dark:from-indigo-950/50 dark:to-purple-950/40 border border-indigo-200 dark:border-indigo-800 text-xs flex items-center justify-between">
                <div>
                  <span className="font-semibold text-indigo-900 dark:text-indigo-200 block">
                    Target Check-Out:
                  </span>
                  <span className="text-[10px] text-slate-500 dark:text-slate-400">
                    Target Work: 7h 45m &bull; Work after this is Overtime!
                  </span>
                </div>
                <span className="text-base font-mono font-extrabold text-indigo-600 dark:text-indigo-400">
                  {calculatedExpectedOut}
                </span>
              </div>
            </div>

            {/* 2. WORK LOCATION: OFFICE OR FIELD */}
            <div className="mt-4">
              <label className="block text-xs font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">
                Work Location / Duty:
              </label>

              <div className="grid grid-cols-2 gap-2.5">
                <button
                  type="button"
                  onClick={() => setSelectedMode('Office')}
                  className={`p-3 rounded-2xl border-2 text-left transition-all flex flex-col justify-between ${
                    selectedMode === 'Office'
                      ? 'border-indigo-600 bg-indigo-50/70 dark:bg-indigo-950/50 shadow-md ring-2 ring-indigo-500/20'
                      : 'border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/60 dark:bg-slate-800/40'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-2xl">🏢</span>
                    <span className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${selectedMode === 'Office' ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'}`}>
                      {selectedMode === 'Office' && <span className="w-1.5 h-1.5 rounded-full bg-white"></span>}
                    </span>
                  </div>
                  <div className="mt-2">
                    <div className="font-bold text-xs text-slate-900 dark:text-white">Office</div>
                    <div className="text-[10px] text-slate-500 dark:text-slate-400">Robotics Lab</div>
                  </div>
                </button>

                <button
                  type="button"
                  onClick={() => setSelectedMode('Field')}
                  className={`p-3 rounded-2xl border-2 text-left transition-all flex flex-col justify-between ${
                    selectedMode === 'Field'
                      ? 'border-amber-600 bg-amber-50/70 dark:bg-amber-950/50 shadow-md ring-2 ring-amber-500/20'
                      : 'border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 bg-slate-50/60 dark:bg-slate-800/40'
                  }`}
                >
                  <div className="flex items-center justify-between">
                    <span className="text-2xl">🚗</span>
                    <span className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${selectedMode === 'Field' ? 'border-amber-600 bg-amber-600' : 'border-slate-300'}`}>
                      {selectedMode === 'Field' && <span className="w-1.5 h-1.5 rounded-full bg-white"></span>}
                    </span>
                  </div>
                  <div className="mt-2">
                    <div className="font-bold text-xs text-slate-900 dark:text-white">Field</div>
                    <div className="text-[10px] text-slate-500 dark:text-slate-400">School / Client Site</div>
                  </div>
                </button>
              </div>

              {selectedMode === 'Field' && (
                <div className="mt-2.5">
                  <input
                    type="text"
                    placeholder="e.g. School Name, Robotics Workshop Site..."
                    value={notes}
                    onChange={(e) => setNotes(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-amber-500"
                  />
                </div>
              )}
            </div>

            {/* 3. LIVE GPS & AREA VERIFICATION BOX */}
            <div className="mt-4 p-3 rounded-2xl bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-xs">
              <div className="flex items-center justify-between mb-1.5">
                <span className="font-bold text-slate-700 dark:text-slate-300 flex items-center gap-1.5">
                  <Icons.MapPin className="w-3.5 h-3.5 text-indigo-500" />
                  Live GPS Area Verification:
                </span>
                <button
                  type="button"
                  onClick={fetchLiveLocation}
                  disabled={isDetecting}
                  className="text-[11px] font-semibold text-indigo-600 dark:text-indigo-400 hover:underline flex items-center gap-1"
                >
                  <Icons.RefreshCw className={`w-3 h-3 ${isDetecting ? 'animate-spin' : ''}`} />
                  {isDetecting ? 'Detecting...' : 'Refresh'}
                </button>
              </div>

              {isDetecting ? (
                <div className="text-slate-500 py-1 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-indigo-500 animate-ping"></span>
                  Detecting real device area and GPS coordinates...
                </div>
              ) : geoData ? (
                <div className="space-y-1">
                  <div className="font-semibold text-slate-900 dark:text-white flex items-center justify-between">
                    <span className="truncate pr-1">📍 {geoData.areaName}</span>
                    <a href={geoData.mapUrl} target="_blank" rel="noreferrer" className="text-indigo-600 dark:text-indigo-400 hover:underline shrink-0 text-[10px]">
                      View Map ↗
                    </a>
                  </div>
                  <div className="text-[11px] text-slate-500 dark:text-slate-400 flex items-center justify-between">
                    <span>Accuracy: ±{geoData.accuracy}m</span>
                    {geoData.distanceMeters !== null && (
                      <span className={`font-bold ${

                          ? 'text-rose-600 dark:text-rose-400'
                          : 'text-emerald-600 dark:text-emerald-400'
                      }`}>
                        {geoData.distanceMeters <= (officeGeo.radiusMeters || 250)
                          ? '✅ Office Verified'
                          : `⚠️ ${(geoData.distanceMeters / 1000).toFixed(1)} km away`}
                      </span>
                    )}
                  </div>
                </div>
              ) : geoError ? (
                <div className="text-amber-600 dark:text-amber-400 text-[11px] leading-tight">
                  ⚠️ {geoError}
                </div>
              ) : (
                <div className="text-slate-400 text-[11px]">
                  Click "Refresh" to verify live GPS.
                </div>
              )}
            </div>

            {/* Actions */}
            <div className="mt-5 flex gap-2.5">
              <button
                type="button"
                onClick={onClose}
                className="flex-1 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={handleSubmit}
                className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-1.5"
              >
                <Icons.CheckCircle className="w-4 h-4" />
                Confirm Check-In
              </button>
            </div>
          </div>
        </div>
      );
    }

              </button>
            </div>

        // MODAL: Chirag (Owner) Space with ID/Password Login & Credentials Creation
    function OwnerSpaceModal({
      isOpen,

      const [officeRadius, setOfficeRadius] = useState(officeGeo.radiusMeters || 250);
      const [geoMsg, setGeoMsg] = useState('');

      useEffect(() => {
        setTab(initialTab);
        setLoginError('');

      const handleLogin = (e) => {
        if (e) e.preventDefault();
        if (loginId.trim().toLowerCase() === ownerAuth.id.toLowerCase() && loginPassword === ownerAuth.password) {
          onLogin();
          setLoginError('');
          if (pendingAction === 'csv') {
            onExecuteCSV();
            onClearPendingAction();
            onClose();

            onClose();
          }

          setLoginError('Invalid Owner ID or Password. Please try again.');

      const handleCreate = (e) => {
        if (e) e.preventDefault();
        if (!newId.trim()) {
          setMsg({ text: 'Please enter a valid Owner ID.', type: 'error' });
          return;

        if (!newPassword || newPassword.length < 3) {
          setMsg({ text: 'Password must be at least 3 characters.', type: 'error' });

        if (newPassword !== confirmPassword) {
          setMsg({ text: 'Passwords do not match.', type: 'error' });
          return;

        const updated = {

          return;

        setGeoMsg('Detecting location...');
        navigator.geolocation.getCurrentPosition(

            onSaveOfficeGeo({

              lon,

                  <button
                    type="button"
                    onClick={() => setWorkLocation('Field')}
                    className={`flex-1 py-1.5 rounded-lg font-bold text-xs border ${workLocation === 'Field' ? 'bg-amber-600 text-white border-amber-600' : 'border-slate-200 dark:border-slate-700'}`}
                  >
                    🚗 Field
                  </button>
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Office In Time (e.g. 09:00 AM)</label>
                <input
                  type="text"
                  value={inTime}
                  onChange={(e) => setInTime(e.target.value)}
                  placeholder="09:00 AM"
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Lunch Out (2:00 PM)</label>
                  <input
                    type="text"
                    value={lunchOut}
                    onChange={(e) => setLunchOut(e.target.value)}
                    placeholder="02:00 PM"
                    className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Lunch In (2:45 PM)</label>
                  <input
                    type="text"
                    value={lunchIn}
                    onChange={(e) => setLunchIn(e.target.value)}
                    placeholder="02:45 PM"
                    className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-600 dark:text-slate-400 mb-1">Office Out Time (e.g. 05:30 PM)</label>
                <input
                  type="text"
                  value={outTime}
                  onChange={(e) => setOutTime(e.target.value)}
                  placeholder="05:30 PM"
                  className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono"
                />
              </div>
            </div>

            <div className="mt-6 flex gap-2">
              <button
                onClick={() => onSave({ ...record, inTime, lunchOut, lunchIn, outTime, workLocation })}
                className="flex-1 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md transition-all"
              >
                Save Changes
              </button>
              <button
                onClick={onClose}
                className="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 font-semibold text-xs hover:bg-slate-100"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Modal to Manage Staff
    function ManageStaffModal({ employees, onClose, onSave, onResetDefaults }) {
      const [list, setList] = useState([...employees]);
      const [newName, setNewName] = useState('');
      const [newRole, setNewRole] = useState('Robotics Engineer');

      const handleAdd = () => {
        if (!newName.trim()) return;
        const newId = `EMP${String(list.length + 1).padStart(2, '0')}`;
        const newEmp = {
          id: newId,
          name: newName.trim(),
          role: newRole.trim() || 'Robotics Engineer',
          avatarBg: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-900/40 dark:text-indigo-300'
        };
        setList([...list, newEmp]);
        setNewName('');
        setNewRole('Robotics Engineer');
      };

      const handleRemove = (id) => {
        setList(list.filter(e => e.id !== id));
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
            <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
              <div>
                <h4 className="font-bold text-slate-900 dark:text-white text-base">Office Staff Management</h4>
                <p className="text-xs text-slate-400">Total {list.length} Staff Members &bull; <strong className="text-amber-600">Owner: Chirag</strong></p>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            {/* Current Staff List */}
            <div className="mt-4 max-h-56 overflow-y-auto space-y-2 pr-1">
              {list.map((emp, index) => (
                <div key={emp.id} className="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs">
                  <div className="flex items-center gap-2.5">
                    <span className="font-mono text-slate-400">{index + 1}.</span>
                    <div>
                      <div className="font-bold text-slate-900 dark:text-white">{emp.name}</div>
                      <div className="text-[11px] text-slate-500">{emp.role}</div>
                    </div>
                  </div>
                  <button
                    onClick={() => handleRemove(emp.id)}
                    className="text-slate-400 hover:text-rose-500 p-1"
                    title="Remove"
                  >
                    &times;
                  </button>
                </div>
              ))}
            </div>

            {/* Add New Employee */}
            <div className="mt-4 pt-3 border-t border-slate-200 dark:border-slate-800">
              <span className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2">Add New Employee</span>
              <div className="grid grid-cols-2 gap-2 text-xs">
                <input
                  type="text"
                  placeholder="Employee Name"
                  value={newName}
                  onChange={(e) => setNewName(e.target.value)}
                  className="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white"
                />
                <input
                  type="text"
                  placeholder="Role (e.g. Robotics Engineer)"
                  value={newRole}
                  onChange={(e) => setNewRole(e.target.value)}
                  className="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white"
                />
              </div>
              <button
                onClick={handleAdd}
                className="mt-2 w-full py-2 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-xs transition-colors"
              >
                + Add to List
              </button>
            </div>

            {/* Footer Buttons */}
            <div className="mt-6 flex items-center justify-between gap-2">
              <button
                onClick={onResetDefaults}
                className="text-xs text-indigo-600 dark:text-indigo-400 hover:underline font-medium"
              >
                Reset Default Staff
              </button>
              <div className="flex gap-2">
                <button
                  onClick={onClose}
                  className="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300"
                >
                  Cancel
                </button>
                <button
                  onClick={() => onSave(list)}
                  className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs shadow-md"
                >
                  Save Staff
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
