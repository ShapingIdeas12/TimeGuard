    // Haversine formula: Calculate real physical distance in meters between two coordinates (Pure Client-side JS)
    function calculateDistanceInMeters(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return null;
      const R = 6371e3;
      const phi1 = lat1 * Math.PI / 180;
      const phi2 = lat2 * Math.PI / 180;
      const deltaPhi = (lat2 - lat1) * Math.PI / 180;
      const deltaLambda = (lon2 - lon1) * Math.PI / 180;

      const a = Math.sin(deltaPhi / 2) * Math.sin(deltaPhi / 2) +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) * Math.sin(deltaLambda / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return Math.round(R * c);
    }

        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);

          gain.gain.setValueAtTime(0.15, now);

    // Helper: Parse Time String (10:00 AM, 09:00 AM, 14:30)
    const parseTimeStr = (str) => {
      if (!str) return null;
      const cleaned = String(str).replace(/\u202f|\xa0/g, ' ').trim();
      const match = cleaned.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i);
      if (!match) return null;
      let hours = parseInt(match[1], 10);
      const mins = parseInt(match[2], 10);
      const meridiem = match[3];
      if (meridiem) {
        if (meridiem.toUpperCase() === 'PM' && hours < 12) hours += 12;
        if (meridiem.toUpperCase() === 'AM' && hours === 12) hours = 0;
      }
      return hours * 60 + mins;
    };

    // Helper: Convert Minutes from midnight back to 12-hour AM/PM string
    const formatMinutesToTimeStr = (totalMins) => {
      if (totalMins === null || totalMins === undefined || isNaN(totalMins)) return '—';
      const h24 = Math.floor(totalMins / 60) % 24;
      const m = totalMins % 60;
      const meridiem = h24 < 12 ? 'AM' : 'PM';
      let h12 = h24 % 12;
      if (h12 === 0) h12 = 12;
      return `${String(h12).padStart(2, '0')}:${String(m).padStart(2, '0')} ${meridiem}`;

    const formatMinutesToHuman = (mins) => {
      if (mins === null || mins === undefined || isNaN(mins) || mins <= 0) return '0 min';

      const m = mins % 60;
      if (h === 0) return `${m} mins`;
      if (m === 0) return `${h} hr${h > 1 ? 's' : ''}`;
      return `${h}h ${m}m`;

          geoVerified: false
        };
      }

      const inMins = parseTimeStr(record.inTime);
      const lunchOutMins = parseTimeStr(record.lunchOut);
      const lunchInMins = parseTimeStr(record.lunchIn);
      const outMins = parseTimeStr(record.outTime);
      const liveMins = parseTimeStr(currentLiveTimeStr);

      // Lunch duration calculation:
      // Standard Shift Rule: 2:00 PM (840m) to 2:45 PM (885m) = 45 min break included!
      let lunchDurationMins = 0;
      let isAutoScheduledLunch = false;

      if (lunchOutMins && lunchInMins) {
        lunchDurationMins = Math.max(0, lunchInMins - lunchOutMins);
      } else if (lunchOutMins && !lunchInMins && liveMins) {
        lunchDurationMins = Math.max(0, liveMins - lunchOutMins);
      } else {
        // If employee did not manually punch lunch, but their shift spans across the scheduled 2:00 PM - 2:45 PM break window,
        // the 45-min break (2:00 PM - 2:45 PM) is automatically included as per company schedule (10:00 to 6:30 includes 2:00 - 2:45 break)!
        const currentEndMins = outMins || liveMins;
        if (inMins && currentEndMins && inMins < 840 && currentEndMins >= 885) {
          lunchDurationMins = 45;
          isAutoScheduledLunch = true;
        }
      }

      // Dynamic Expected Checkout Time based on morning check-in:
      // If employee came early (e.g. 8:30, 9:00, 9:30 AM), their checkout adapts!
      // In + 510 minutes (8.5 hrs total span including 45m lunch = 7h 45m net work)
      // e.g. 09:00 AM (540m) + 510m = 1050m (05:30 PM!)
      // e.g. 08:30 AM (510m) + 510m = 1020m (05:00 PM) or school target 05:30 PM (540m)
      let expectedOutMins = 0;
      if (record.expectedOutTime) {
        expectedOutMins = parseTimeStr(record.expectedOutTime);
      } else if (inMins <= 555) { // Arrived at or before 9:15 AM
        expectedOutMins = 1050; // 05:30 PM (School early timing requested by user!)
      } else {
        expectedOutMins = inMins + 510; // inTime + 8.5 hours
      }
      const expectedOutStr = record.expectedOutTime || formatMinutesToTimeStr(expectedOutMins);

      // Status determination
      let status = 'WORKING';
      let statusLabel = 'Working (Active)';
      let badgeClass = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/70 dark:text-emerald-300 border border-emerald-300 dark:border-emerald-700 active-glow';

      if (record.outTime) {
        status = 'COMPLETED';
        statusLabel = 'Logged Out (Shift Done)';
        badgeClass = 'bg-blue-100 text-blue-800 dark:bg-blue-950/70 dark:text-blue-300 border border-blue-300 dark:border-blue-700';
      } else if (record.lunchOut && !record.lunchIn) {
        status = 'ON_LUNCH';
        statusLabel = 'On Lunch Break';
        badgeClass = 'bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300 border border-amber-300 dark:border-amber-700 lunch-glow';
      }

      // Calculate gross and net
      let grossMins = 0;
      let netMins = 0;

      if (outMins) {
        grossMins = Math.max(0, outMins - inMins);
      } else if (liveMins) {
        grossMins = Math.max(0, liveMins - inMins);
      }

      const confirmedLunchMins = lunchDurationMins;
      netMins = Math.max(0, grossMins - confirmedLunchMins);

      // SEPARATE OVERTIME & SHORT HOURS CALCULATION (Exact user requirement)
      const targetNetMins = record.targetNetMins || SHIFT_CONFIG.targetWorkMins; // 465 mins (7h 45m)
      let overtimeMins = 0;
      let shortMins = 0;
      let shiftCompliance = 'In Progress';
      let complianceClass = 'text-blue-600 dark:text-blue-400';

      if (outMins) {
        const diffFromTarget = netMins - targetNetMins;
        if (diffFromTarget > 0) {
          overtimeMins = diffFromTarget;
          shiftCompliance = `Standard Met (+${formatMinutesToHuman(overtimeMins)} OT)`;
          complianceClass = 'text-emerald-600 dark:text-emerald-400 font-semibold';
        } else if (diffFromTarget < 0) {
          shortMins = Math.abs(diffFromTarget);
          shiftCompliance = `Short by ${formatMinutesToHuman(shortMins)}`;
          complianceClass = 'text-rose-600 dark:text-rose-400 font-semibold';
        } else {
          shiftCompliance = 'Standard Met (Exact 7h 45m)';
          complianceClass = 'text-emerald-600 dark:text-emerald-400 font-semibold';
        }
      } else {
        // Still working live
        if (liveMins && liveMins > expectedOutMins) {
          const liveNet = Math.max(0, liveMins - inMins - confirmedLunchMins);
          if (liveNet > targetNetMins) {
            overtimeMins = liveNet - targetNetMins;
            shiftCompliance = `In Overtime (+${formatMinutesToHuman(overtimeMins)})`;
            complianceClass = 'text-amber-600 dark:text-amber-400 font-bold';
          } else {
            shiftCompliance = `Target Out: ${expectedOutStr}`;
            complianceClass = 'text-blue-600 dark:text-blue-400';
          }
        } else {
          shiftCompliance = `Target Out: ${expectedOutStr}`;
          complianceClass = 'text-blue-600 dark:text-blue-400';
        }
      }

      // Location & Anti-Cheat verification logic
      const workLocation = record.workLocation || 'Office';
      const locationNote = record.locationNote || '';
      const areaName = record.areaName || '';
      const distance = record.distanceMeters;

      let locationDisplay = workLocation === 'Field' ? '🚗 Field' : '🏢 Office';
      let geoVerified = Boolean(record.isVerifiedOffice);

      return {
        status,
        statusLabel,
        badgeClass,
        lunchDurationMins,
        isAutoScheduledLunch,
        confirmedLunchMins,
        grossMins,
        netMins,
        overtimeMins,
        shortMins,
        targetNetMins,
        expectedOutStr,
        shiftCompliance,
        complianceClass,
        workLocation,
        locationNote,
        areaName,
        distance,
        locationDisplay,
        geoVerified,
        mapUrl: record.mapUrl || (record.latitude ? `https://maps.google.com/?q=${record.latitude},${record.longitude}` : null)
      };
    }

              'Office Out',
              'Net Work',
              'Overtime (OT)',
              'Shift Status'
            ]],
            body: tableRows,
            theme: 'striped',
            headStyles: {
              fillColor: [79, 70, 229],
              textColor: [255, 255, 255],
              fontStyle: 'bold',
              fontSize: 7.5,
              halign: 'center'
            },
            bodyStyles: {
              fontSize: 7.2,
              halign: 'center'
            },
            columnStyles: {
              0: { cellWidth: 6, halign: 'center' },
              1: { cellWidth: 20, halign: 'left', fontStyle: 'bold' },
              2: { cellWidth: 24, halign: 'left' },
              3: { cellWidth: 13 },
              4: { cellWidth: 16 },
              5: { cellWidth: 16 },
              6: { cellWidth: 14 },
              7: { cellWidth: 16 },
              8: { cellWidth: 17, fontStyle: 'bold' },
              9: { cellWidth: 19, fontStyle: 'bold', textColor: [217, 119, 6] },
              10: { cellWidth: 29 }
            },
            alternateRowStyles: {
              fillColor: [248, 250, 252]
            },
            margin: { left: 8, right: 8 }
          });

          // Signature Block
          const finalY = (doc.lastAutoTable && doc.lastAutoTable.finalY) ? doc.lastAutoTable.finalY + 18 : 180;
          doc.setDrawColor(203, 213, 225);
          doc.line(16, finalY, 66, finalY);
          doc.line(pageWidth - 76, finalY, pageWidth - 16, finalY);

          doc.setFontSize(8);
          doc.setTextColor(100, 116, 139);
          doc.text("HR / Operations Signature", 18, finalY + 5);
          doc.text("Approved & Verified: Chirag (Owner)", pageWidth - 74, finalY + 5);

          // Save PDF file
          doc.save(`Office_Attendance_Overtime_Report_${currentDateStr}.pdf`);
        } catch (err) {
          console.error("PDF generation error, fallback to print view:", err);
          window.print();
        }
      };

      const weekDays = useMemo(() => getWeekDays(currentDateStr), [currentDateStr]);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
          
          {/* TOP NAV & BRAND BAR */}
          <header className="flex flex-col md:flex-row items-center justify-between gap-4 pb-6 border-b border-slate-200 dark:border-slate-800">
            <div className="flex items-center gap-3.5">
              <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                <Icons.Clock className="w-7 h-7" />
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-slate-900 to-indigo-900 dark:from-white dark:to-indigo-200 bg-clip-text text-transparent">
                    OfficeTime Pro
                  </h1>
                  <span className="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300">
                    Robotics Team ({employees.length} Staff)
                  </span>
                </div>
                <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                  Early School Shifts (8:30 / 9:00 AM) &bull; Standard (10:00 AM) &bull; <strong className="text-amber-600 dark:text-amber-400">Owner: Chirag</strong>
                </p>
              </div>
            </div>

            {/* Live Clock, Owner Space & Action Controls */}
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3.5 py-1.5 text-right shadow-sm">
                <div className="text-[10px] uppercase tracking-wider font-semibold text-slate-500 dark:text-slate-400 flex items-center justify-end gap-1.5">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                  Live Time
                </div>
                <div className="text-lg font-mono font-bold text-indigo-600 dark:text-indigo-400">
                  {liveTime}
                </div>
              </div>

              {/* OWNER SPACE (Chirag) LOGIN / STATUS BUTTON */}
              {isOwnerLoggedIn ? (
                <div className="flex items-center gap-2 bg-gradient-to-r from-amber-50 to-orange-50 dark:from-amber-950/40 dark:to-orange-950/30 border border-amber-300 dark:border-amber-700/60 rounded-xl px-3 py-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <div className="text-left">
                    <span className="text-[10px] uppercase font-bold text-amber-700 dark:text-amber-400 block leading-tight">Owner Active</span>
                    <span className="text-xs font-extrabold text-slate-900 dark:text-white">👑 Chirag</span>
                  </div>
                  <div className="flex items-center gap-1 ml-1 border-l border-amber-200 dark:border-amber-800 pl-1.5">
                    <button
                      onClick={() => { setOwnerSpaceTab('create'); setShowOwnerSpaceModal(true); }}
                      className="p-1 text-amber-700 dark:text-amber-300 hover:text-amber-900 rounded hover:bg-amber-100 dark:hover:bg-amber-900/50"
                      title="Manage ID / Password"
                    >
                      <Icons.Key className="w-3.5 h-3.5" />
                    </button>
                    <button
                      onClick={() => { setIsOwnerLoggedIn(false); playChime('logout'); }}
                      className="px-2 py-0.5 rounded-lg bg-amber-200 dark:bg-amber-800 hover:bg-amber-300 text-[11px] font-bold text-amber-900 dark:text-amber-100"
                      title="Lock Owner Session"
                    >
                      Lock
                    </button>
                  </div>
                </div>
              ) : (
                <button
                  onClick={() => { setOwnerSpaceTab('login'); setShowOwnerSpaceModal(true); }}
                  className="flex items-center gap-2 px-3 py-2 rounded-xl border border-amber-200 dark:border-amber-800/60 bg-amber-50/80 hover:bg-amber-100 dark:bg-amber-950/40 dark:hover:bg-amber-900/40 text-amber-900 dark:text-amber-200 text-xs font-bold shadow-sm transition-all"
                  title="Chirag (Owner) Login / Setup"
                >
                  <span className="text-sm">👑</span>
                  <span>Owner Space (Chirag)</span>
                  <Icons.Lock className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" />
                </button>
              )}

              {/* Manage Staff Button */}
              <button
                onClick={() => setShowManageStaffModal(true)}
                className="flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-semibold shadow-sm transition-colors"
                title="Manage Employee Names"
              >
                <Icons.Users className="w-4 h-4 text-indigo-500" />
                <span>Staff</span>
              </button>

              {/* Dark mode button */}
              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors shadow-sm"
                title="Toggle Dark/Light Mode"
              >
                {darkMode ? <Icons.Sun className="w-5 h-5" /> : <Icons.Moon className="w-5 h-5" />}
              </button>
            </div>
          </header>

          {/* SECONDARY CONTROLS & TABS */}
          <div className="mt-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            {/* Tabs */}
            <div className="flex items-center gap-1.5 bg-slate-200/80 dark:bg-slate-900 p-1 rounded-xl">
              <button
                onClick={() => setActiveTab('dashboard')}
                className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'dashboard'
                    ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                Today's Punch Cards
              </button>
              <button
                onClick={() => setActiveTab('weekly')}
                className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'weekly'
                    ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                Weekly Timesheet
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                  activeTab === 'history'
                    ? 'bg-white dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                }`}
              >
                Daily Table & Overtime Log
              </button>
            </div>

            {/* Date Selector & Action Buttons */}
            <div className="flex flex-wrap items-center gap-2.5">
              <div className="flex items-center gap-2 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-1.5 shadow-sm">
                <Icons.Calendar className="w-4 h-4 text-slate-500" />
                <input
                  type="date"
                  value={currentDateStr}
                  onChange={(e) => setCurrentDateStr(e.target.value)}
                  className="bg-transparent text-sm font-medium focus:outline-none text-slate-800 dark:text-slate-200"
                />
              </div>

              <button
                onClick={handleFillSampleData}
                className="flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold rounded-xl bg-violet-50 text-violet-700 hover:bg-violet-100 dark:bg-violet-950/60 dark:text-violet-300 dark:hover:bg-violet-900/60 border border-violet-200 dark:border-violet-800 transition-colors shadow-sm"
                title="Fill all employees with realistic school shifts and overtime for testing"
              >
                <Icons.Sparkles className="w-4 h-4" />
                Demo Fill Today
              </button>

              {/* PROTECTED CSV BUTTON (Only Chirag can download after login) */}
              <button
                onClick={handleCSVClick}
                className={`flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl border shadow-sm transition-all ${
                  isOwnerLoggedIn
                    ? 'border-emerald-200 dark:border-emerald-800 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-700 dark:text-emerald-300 hover:bg-emerald-100'
                    : 'border-amber-200 dark:border-amber-800 bg-amber-50/70 dark:bg-amber-950/30 text-amber-800 dark:text-amber-300 hover:bg-amber-100'
                }`}
                title={isOwnerLoggedIn ? "Download Attendance CSV Report (Authorized)" : "🔒 Chirag (Owner) Login Required to Download CSV"}
              >
                {isOwnerLoggedIn ? (
                  <Icons.Download className="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400" />
                ) : (
                  <Icons.Lock className="w-3.5 h-3.5 text-amber-600 dark:text-amber-400" />
                )}
                <span>CSV {isOwnerLoggedIn ? '(Unlocked)' : '(Owner Only)'}</span>
              </button>

              <button
                onClick={generatePDFReport}
                className="flex items-center gap-2 px-4 py-2 text-sm font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-500/25 transition-all"
              >
                <Icons.FilePdf className="w-4 h-4" />
                Generate Overall PDF
              </button>

              <button
                onClick={handleResetToday}
                className="p-2 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 rounded-xl hover:bg-rose-50 dark:hover:bg-rose-950/50 transition-colors"
                title="Reset punches for current date"
              >
                <Icons.RefreshCw className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* ALL LOGGED OUT CELEBRATION BANNER */}
          {allLoggedOut && (
            <div className="mt-6 bg-gradient-to-r from-emerald-500 via-teal-500 to-indigo-600 text-white p-5 rounded-2xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-3.5">
                <div className="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-md flex items-center justify-center shrink-0">
                  <Icons.CheckCircle className="w-7 h-7 text-white" />
                </div>
                <div>
                  <h3 className="text-lg font-bold">All {employees.length} Staff Members Have Completed Their Shift!</h3>
                  <p className="text-xs text-white/90">
                    Everyone has logged out for {new Date(currentDateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}. Total team overtime: <strong>{formatMinutesToHuman(totalOvertimeToday)}</strong>.
                  </p>
                </div>
              </div>
              <button
                onClick={generatePDFReport}
                className="px-5 py-2.5 rounded-xl bg-white text-indigo-700 hover:bg-indigo-50 font-bold text-sm shadow-md transition-all shrink-0 flex items-center gap-2"
              >
                <Icons.FilePdf className="w-5 h-5 text-indigo-600" />
                Download Final PDF Summary
              </button>
            </div>
          )}

          {/* METRIC STATS STRIP (5 CARDS: Includes Separate Overtime Tracker) */}
          <div className="mt-6 grid grid-cols-2 lg:grid-cols-5 gap-4">
            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <div className="text-xs font-semibold text-slate-500 uppercase">Robotics Team Staff</div>
              <div className="mt-2 flex items-baseline justify-between">
                <span className="text-2xl font-extrabold text-slate-900 dark:text-white">{employees.length} Staff</span>
                <span className="text-xs text-amber-600 dark:text-amber-400 font-bold">Owner: Chirag</span>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <div className="text-xs font-semibold text-slate-500 uppercase">Active Working</div>
              <div className="mt-2 flex items-baseline justify-between">
                <span className="text-2xl font-extrabold text-emerald-600 dark:text-emerald-400">
                  {employees.filter(e => {
                    const r = todayRecords[e.id];
                    return r && r.inTime && !r.outTime && (!r.lunchOut || r.lunchIn);
                  }).length}
                </span>
                <span className="text-xs text-slate-400">
                  {employees.filter(e => todayRecords[e.id]?.workLocation === 'Field').length > 0 ? (
                    <span className="text-amber-600 font-medium">({employees.filter(e => todayRecords[e.id]?.workLocation === 'Field').length} on Field)</span>
                  ) : 'At Work'}
                </span>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <div className="text-xs font-semibold text-slate-500 uppercase">On Lunch (2 - 2:45 PM)</div>
              <div className="mt-2 flex items-baseline justify-between">
                <span className="text-2xl font-extrabold text-amber-500">
                  {employees.filter(e => {
                    const r = todayRecords[e.id];
                    return r && r.lunchOut && !r.lunchIn && !r.outTime;
                  }).length}
                </span>
                <span className="text-xs text-amber-600 dark:text-amber-400 font-medium">Break Time</span>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm">
              <div className="text-xs font-semibold text-slate-500 uppercase">Shift Finished</div>
              <div className="mt-2 flex items-baseline justify-between">
                <span className="text-2xl font-extrabold text-blue-600 dark:text-blue-400">
                  {loggedOutCount} / {employees.length}
                </span>
                <span className="text-xs text-slate-400">
                  {Math.round((loggedOutCount / (employees.length || 1)) * 100)}% Finished
                </span>
              </div>
            </div>

            {/* SEPARATE OVERTIME KPI CARD */}
            <div className="bg-gradient-to-br from-amber-500/10 via-amber-500/5 to-transparent border border-amber-300 dark:border-amber-700/60 rounded-2xl p-4 shadow-sm col-span-2 lg:col-span-1">
              <div className="text-xs font-bold text-amber-700 dark:text-amber-400 uppercase flex items-center gap-1.5">
                <Icons.Star className="w-3.5 h-3.5 text-amber-500" />
                <span>Total Overtime (OT)</span>
              </div>
              <div className="mt-2 flex items-baseline justify-between">
                <span className="text-2xl font-mono font-extrabold text-amber-600 dark:text-amber-400">
                  +{formatMinutesToHuman(totalOvertimeToday)}
                </span>
                <span className="text-[11px] font-semibold text-amber-800 dark:text-amber-300">
                  {employeesWithOvertimeCount} Staff OT
                </span>
              </div>
            </div>
          </div>

          {/* TAB 1: MAIN PUNCH CARDS FOR EMPLOYEES */}
          {activeTab === 'dashboard' && (
            <div className="mt-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <span>Employee Timecards & Actions</span>
                  </h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Supports Morning School Shifts (8:30 / 9:00 AM) &bull; Target Check-out dynamically calculated (e.g. 5:30 PM) &bull; Overtime separated
                  </p>
                </div>
                <span className="text-xs text-slate-400 hidden sm:inline">
                  📍 Click "Office In" to select Arrival Time, School/Office Mode & GPS
                </span>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
                {employees.map((emp) => {
                  const record = todayRecords[emp.id] || {};
                  const metrics = calculateRecordMetrics(record, liveTime, officeGeo);

                  const hasCheckedIn = Boolean(record.inTime);
                  const hasLunchOut = Boolean(record.lunchOut);
                  const hasLunchIn = Boolean(record.lunchIn);
                  const hasCheckedOut = Boolean(record.outTime);

                  const canCheckIn = !hasCheckedIn;
                  const canLunchOut = hasCheckedIn && !hasLunchOut && !hasCheckedOut;
                  const canLunchIn = hasLunchOut && !hasLunchIn && !hasCheckedOut;
                  const canCheckOut = hasCheckedIn && (!hasLunchOut || hasLunchIn) && !hasCheckedOut;

                  return (
                    <div
                      key={emp.id}
                      className={`bg-white dark:bg-slate-900 rounded-2xl border transition-all duration-200 overflow-hidden shadow-sm flex flex-col justify-between ${
                        metrics.overtimeMins > 0
                          ? 'border-amber-400 dark:border-amber-500 ot-glow'
                          : metrics.status === 'WORKING'
                          ? 'border-emerald-400 dark:border-emerald-600 shadow-emerald-500/10 shadow-lg'
                          : metrics.status === 'ON_LUNCH'
                          ? 'border-amber-400 dark:border-amber-600 shadow-amber-500/10 shadow-lg'
                          : metrics.status === 'COMPLETED'
                          ? 'border-blue-300 dark:border-blue-800'
                          : 'border-slate-200 dark:border-slate-800'
                      }`}
                    >
                      {/* Card Top */}
                      <div className="p-4 sm:p-5">
                        <div className="flex items-start justify-between gap-3">
                          <div className="flex items-center gap-3">
                            <div className={`w-11 h-11 rounded-xl flex items-center justify-center font-bold text-base shadow-sm ${emp.avatarBg || 'bg-indigo-100 text-indigo-700'}`}>
                              {emp.name.substring(0, 2).toUpperCase()}
                            </div>
                            <div>
                              <div className="flex items-center gap-1.5">
                                <h3 className="font-bold text-slate-900 dark:text-white text-base">
                                  {emp.name}
                                </h3>
                                <span className="text-[10px] font-mono text-slate-400">{emp.id}</span>
                              </div>
                              <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">
                                {emp.role}
                              </p>
                            </div>
                          </div>

                          {/* Edit manual icon */}
                          <button
                            onClick={() => setSelectedEmployeeForModal(emp)}
                            className="text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
                            title="Edit timestamps manually"
                          >
                            <Icons.Edit3 className="w-4 h-4" />
                          </button>
                        </div>

                        {/* Status Badge & Work Mode */}
                        <div className="mt-3.5 flex items-center gap-2 flex-wrap">
                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold ${metrics.badgeClass}`}>
                            <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
                            {metrics.statusLabel}
                          </span>

                          {hasCheckedIn && (
                            <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-[11px] font-bold ${
                              record.workLocation === 'Field'
                                ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/70 dark:text-amber-300 border border-amber-300'
                                : 'bg-blue-100 text-blue-800 dark:bg-blue-950/70 dark:text-blue-300 border border-blue-300'
                            }`}>
                              {record.workLocation === 'Field' ? '🚗 Field' : '🏢 Office'}
                            </span>
                          )}
                        </div>

                        {/* Target Expected Checkout Highlight for Early Shifts */}
                        {hasCheckedIn && (
                          <div className="mt-2.5 flex items-center justify-between text-[11px] bg-slate-50 dark:bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                            <span className="text-slate-500 dark:text-slate-400 font-medium">Expected Check-Out:</span>
                            <span className="font-mono font-bold text-indigo-600 dark:text-indigo-400">
                              {metrics.expectedOutStr}
                            </span>
                          </div>
                        )}

                        {/* Location / Area Display */}
                        {hasCheckedIn && record.areaName && (
                          <div className="mt-2 text-[11px] bg-slate-50 dark:bg-slate-800/80 p-2 rounded-lg border border-slate-200 dark:border-slate-700 flex items-start gap-1.5">
                            <Icons.MapPin className="w-3.5 h-3.5 text-indigo-500 shrink-0 mt-0.5" />
                            <div className="leading-tight overflow-hidden text-ellipsis">
                              <span className="font-semibold text-slate-700 dark:text-slate-200 block truncate">
                                {record.areaName}
                              </span>
                              <div className="flex items-center gap-2 mt-0.5 text-[10px] text-slate-400">
                                {record.distanceMeters !== undefined && record.distanceMeters !== null && (
                                  <span>{record.distanceMeters <= (officeGeo.radiusMeters || 250) ? '✅ Office Verified' : `${(record.distanceMeters / 1000).toFixed(1)} km away`}</span>
                                )}
                                {record.mapUrl && (
                                  <a href={record.mapUrl} target="_blank" rel="noreferrer" className="text-indigo-600 dark:text-indigo-400 hover:underline">
                                    Map ↗
                                  </a>
                                )}
                              </div>
                            </div>
                          </div>
                        )}

                        {/* Timestamps Grid */}
                        <div className="mt-3.5 grid grid-cols-2 gap-2 text-xs bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-800">
                          <div>
                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Office In</span>
                            <span className="font-mono font-bold text-slate-700 dark:text-slate-200">
                              {record.inTime || '—'}
                            </span>
                          </div>
                          <div>
                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Office Out</span>
                            <span className="font-mono font-bold text-slate-700 dark:text-slate-200">
                              {record.outTime || '—'}
                            </span>
                          </div>
                          <div className="border-t border-slate-200 dark:border-slate-700 pt-1.5 mt-0.5">
                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Lunch Out</span>
                            <span className="font-mono text-slate-600 dark:text-slate-300">
                              {record.lunchOut || '—'}
                            </span>
                          </div>
                          <div className="border-t border-slate-200 dark:border-slate-700 pt-1.5 mt-0.5">
                            <span className="text-slate-400 block text-[10px] uppercase font-semibold">Lunch In</span>
                            <span className="font-mono text-slate-600 dark:text-slate-300">
                              {record.lunchIn || '—'}
                            </span>
                          </div>
                        </div>

                        {/* TOTAL DURATION & SEPARATE OVERTIME BOX */}
                        <div className="mt-3 bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/60 rounded-xl p-3">
                          <div className="flex items-center justify-between text-xs">
                            <span className="font-semibold text-indigo-900 dark:text-indigo-200">
                              {hasCheckedOut ? 'Net Work Duration:' : 'Elapsed Work:'}
                            </span>
                            <span className="font-mono font-extrabold text-indigo-700 dark:text-indigo-300 text-sm">
                              {formatMinutesToHuman(metrics.netMins)}
                            </span>
                          </div>
                          
                          {/* SEPARATE OVERTIME BADGE (Highlighted in Gold) */}
                          {metrics.overtimeMins > 0 && (
                            <div className="mt-2 bg-gradient-to-r from-amber-100 to-amber-50 dark:from-amber-950/80 dark:to-amber-900/40 border border-amber-300 dark:border-amber-700 rounded-lg px-2.5 py-1 flex items-center justify-between text-xs">
                              <span className="font-bold text-amber-900 dark:text-amber-200 flex items-center gap-1">
                                <Icons.Star className="w-3.5 h-3.5 text-amber-500" />
                                Extra Overtime (OT):
                              </span>
                              <span className="font-mono font-extrabold text-amber-700 dark:text-amber-300 text-xs">
                                +{formatMinutesToHuman(metrics.overtimeMins)}
                              </span>
                            </div>
                          )}

                          {/* SHORT HOURS DEFICIT BADGE */}
                          {hasCheckedOut && metrics.shortMins > 0 && (
                            <div className="mt-2 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 rounded-lg px-2.5 py-1 flex items-center justify-between text-xs">
                              <span className="font-bold text-rose-800 dark:text-rose-300">Short Hours Deficit:</span>
                              <span className="font-mono font-extrabold text-rose-600 dark:text-rose-400">
                                -{formatMinutesToHuman(metrics.shortMins)}
                              </span>
                            </div>
                          )}

                          <div className="mt-1.5 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
                            <span>Lunch: <strong>{metrics.lunchDurationMins > 0 ? `${metrics.lunchDurationMins}m` : '0m'}</strong></span>
                            <span className={metrics.complianceClass}>
                              {metrics.shiftCompliance}
                            </span>
                          </div>
                        </div>
                      </div>

                      {/* Card Bottom: Punch Action Buttons */}
                      <div className="p-3 bg-slate-50/80 dark:bg-slate-900/80 border-t border-slate-100 dark:border-slate-800 grid grid-cols-2 gap-2">
                        {/* 1. Office In (Opens Location & Flexible Time Modal) */}
                        <button
                          disabled={!canCheckIn}
                          onClick={() => setCheckInModalEmployee(emp)}
                          className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                            canCheckIn
                              ? 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm'
                              : 'bg-slate-200/60 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                          }`}
                        >
                          <Icons.LogIn className="w-3.5 h-3.5" />
                          Office In
                        </button>

                        {/* 2. Lunch Out */}
                        <button
                          disabled={!canLunchOut}
                          onClick={() => handleLunchOut(emp.id)}
                          className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                            canLunchOut
                              ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-sm'
                              : 'bg-slate-200/60 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                          }`}
                          title="Start Lunch Break (2:00 PM - 2:45 PM)"
                        >
                          <Icons.Utensils className="w-3.5 h-3.5" />
                          Lunch Out
                        </button>

                        {/* 3. Lunch In */}
                        <button
                          disabled={!canLunchIn}
                          onClick={() => handleLunchIn(emp.id)}
                          className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                            canLunchIn
                              ? 'bg-amber-600 hover:bg-amber-700 text-white shadow-sm animate-pulse'
                              : 'bg-slate-200/60 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                          }`}
                          title="Back from Lunch Break"
                        >
                          <Icons.Coffee className="w-3.5 h-3.5" />
                          Lunch In
                        </button>

                        {/* 4. Office Out */}
                        <button
                          disabled={!canCheckOut}
                          onClick={() => handlePunchOut(emp.id)}
                          className={`flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold transition-all ${
                            canCheckOut
                              ? 'bg-rose-600 hover:bg-rose-700 text-white shadow-sm'
                              : 'bg-slate-200/60 dark:bg-slate-800 text-slate-400 cursor-not-allowed'
                          }`}
                          title="Finish Shift & Calculate Total + Overtime"
                        >
                          <Icons.LogOut className="w-3.5 h-3.5" />
                          Office Out
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* TAB 2: WEEKLY TIMESHEET (Includes Weekly Overtime OT Column) */}
          {activeTab === 'weekly' && (
            <div className="mt-8">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900 dark:text-white">
                    Weekly Attendance & Overtime Breakdown
                  </h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Week of {weekDays[0].formatted} – {weekDays[6].formatted} &bull; Target: 46h 30m regular &bull; Separate Overtime (OT) earned
                  </p>
                </div>
                <div className="flex items-center gap-2">
                  <span className="text-xs font-medium text-slate-500">Days:</span>
                  <div className="flex gap-1">
                    {weekDays.map(d => (
                      <button
                        key={d.dateStr}
                        onClick={() => setCurrentDateStr(d.dateStr)}
                        className={`px-2.5 py-1 text-xs rounded-lg font-medium transition-colors ${
                          d.isCurrentSelected
                            ? 'bg-indigo-600 text-white font-bold'
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200'
                        }`}
                      >
                        {d.dayName}
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              {/* Weekly Matrix Table */}
              <div className="overflow-x-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 text-slate-700 dark:text-slate-300 uppercase font-semibold border-b border-slate-200 dark:border-slate-800">
                    <tr>
                      <th className="py-3 px-4">Employee</th>
                      {weekDays.map(day => (
                        <th key={day.dateStr} className={`py-3 px-3 text-center ${day.isCurrentSelected ? 'bg-indigo-50 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 font-bold' : ''}`}>
                          <div>{day.dayName}</div>
                          <div className="text-[10px] font-normal text-slate-400">{day.formatted}</div>
                        </th>
                      ))}
                      <th className="py-3 px-4 text-center bg-indigo-100/50 dark:bg-indigo-900/30 text-indigo-900 dark:text-indigo-200 font-bold">
                        Weekly Total
                      </th>
                      <th className="py-3 px-4 text-center bg-amber-100/50 dark:bg-amber-900/30 text-amber-900 dark:text-amber-200 font-bold">
                        ⭐ Overtime (OT)
                      </th>
                      <th className="py-3 px-4 text-center">Avg / Day</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {employees.map(emp => {
                      let weeklyTotalMinutes = 0;
                      let weeklyOvertimeMinutes = 0;
                      let daysPresent = 0;

                      return (
                        <tr key={emp.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition-colors">
                          <td className="py-3.5 px-4 font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <span className={`w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold ${emp.avatarBg || 'bg-indigo-100 text-indigo-700'}`}>
                              {emp.name.substring(0, 1)}
                            </span>
                            <div>
                              <div>{emp.name}</div>
                              <span className="text-[10px] text-slate-400 font-medium">{emp.role}</span>
                            </div>
                          </td>

                          {weekDays.map(day => {
                            const dayRecord = (attendanceData[day.dateStr] || {})[emp.id];
                            const metrics = calculateRecordMetrics(dayRecord, liveTime, officeGeo);
                            const hasRecord = dayRecord && dayRecord.inTime;

                            if (hasRecord && metrics.netMins > 0) {
                              weeklyTotalMinutes += metrics.netMins;
                              weeklyOvertimeMinutes += metrics.overtimeMins;
                              daysPresent++;
                            }

                            return (
                              <td key={day.dateStr} className={`py-3 px-2 text-center ${day.isCurrentSelected ? 'bg-indigo-50/40 dark:bg-indigo-950/20' : ''}`}>
                                {hasRecord ? (
                                  <div className="inline-block bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded-lg">
                                    <div className="font-mono font-bold text-slate-800 dark:text-slate-200">
                                      {formatMinutesToHuman(metrics.netMins)}
                                    </div>
                                    {metrics.overtimeMins > 0 && (
                                      <div className="text-[9px] font-bold text-amber-600 dark:text-amber-400">
                                        +{formatMinutesToHuman(metrics.overtimeMins)} OT
                                      </div>
                                    )}
                                  </div>
                                ) : (
                                  <span className="text-slate-300 dark:text-slate-600">—</span>
                                )}
                              </td>
                            );
                          })}

                          <td className="py-3.5 px-4 text-center font-mono font-bold text-sm bg-indigo-50/30 dark:bg-indigo-950/20 text-indigo-700 dark:text-indigo-300">
                            {formatMinutesToHuman(weeklyTotalMinutes)}
                          </td>

                          {/* SEPARATE WEEKLY OVERTIME COLUMN */}
                          <td className="py-3.5 px-4 text-center font-mono font-bold text-sm bg-amber-50/30 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400">
                            {weeklyOvertimeMinutes > 0 ? `+${formatMinutesToHuman(weeklyOvertimeMinutes)}` : '0m'}
                          </td>

                          <td className="py-3.5 px-4 text-center font-mono text-slate-600 dark:text-slate-400">
                            {daysPresent > 0 ? formatMinutesToHuman(Math.round(weeklyTotalMinutes / daysPresent)) : '0m'}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 3: FULL DAILY TABLE & SEPARATE OVERTIME LOG */}
          {activeTab === 'history' && (
            <div className="mt-8">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900 dark:text-white">
                    Daily Attendance, Shifts & Overtime Log ({new Date(currentDateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })})
                  </h2>
                  <p className="text-xs text-slate-500 dark:text-slate-400">
                    Includes dynamic arrival, target checkout, separate Overtime (OT), and short hours
                  </p>
                </div>
                <button
                  onClick={() => window.print()}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-50 transition-colors"
                >
                  <Icons.Printer className="w-4 h-4" />
                  Print View
                </button>
              </div>

              <div className="overflow-x-auto bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-800/60 text-slate-700 dark:text-slate-300 uppercase font-semibold border-b border-slate-200 dark:border-slate-800">
                    <tr>
                      <th className="py-3 px-3">#</th>
                      <th className="py-3 px-3">Employee</th>
                      <th className="py-3 px-3">Role</th>
                      <th className="py-3 px-3">Mode</th>
                      <th className="py-3 px-3">Office In</th>
                      <th className="py-3 px-3 text-indigo-600 dark:text-indigo-400">Target Out</th>
                      <th className="py-3 px-3">Lunch Time</th>
                      <th className="py-3 px-3">Office Out</th>
                      <th className="py-3 px-3 font-bold">Net Work</th>
                      <th className="py-3 px-3 bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400 font-bold">⭐ Overtime (OT)</th>
                      <th className="py-3 px-3 text-rose-600">Short Hours</th>
                      <th className="py-3 px-3">Shift Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {employees.map((emp, idx) => {
                      const rec = todayRecords[emp.id] || {};
                      const metrics = calculateRecordMetrics(rec, liveTime, officeGeo);

                      return (
                        <tr key={emp.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                          <td className="py-3 px-3 text-slate-400 font-mono">{idx + 1}</td>
                          <td className="py-3 px-3 font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <span className={`w-6 h-6 rounded-md flex items-center justify-center text-[10px] font-bold ${emp.avatarBg || 'bg-indigo-100 text-indigo-700'}`}>
                              {emp.name.substring(0, 1)}
                            </span>
                            {emp.name}
                          </td>
                          <td className="py-3 px-3 text-slate-500 font-medium">{emp.role}</td>
                          <td className="py-3 px-3">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              rec.workLocation === 'Field'
                                ? 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300'
                                : 'bg-blue-100 text-blue-800 dark:bg-blue-950/60 dark:text-blue-300'
                            }`}>
                              {rec.workLocation === 'Field' ? '🚗 Field' : '🏢 Office'}
                            </span>
                          </td>
                          <td className="py-3 px-3 font-mono font-bold text-slate-800 dark:text-slate-200">{rec.inTime || '—'}</td>
                          <td className="py-3 px-3 font-mono font-semibold text-indigo-600 dark:text-indigo-400">{metrics.expectedOutStr}</td>
                          <td className="py-3 px-3 font-mono">
                            {metrics.lunchDurationMins > 0 ? `${metrics.lunchDurationMins}m` : '—'}
                          </td>
                          <td className="py-3 px-3 font-mono font-bold text-slate-800 dark:text-slate-200">{rec.outTime || '—'}</td>
                          <td className="py-3 px-3 font-mono font-bold text-indigo-600 dark:text-indigo-400 text-sm">
                            {metrics.netMins > 0 ? formatMinutesToHuman(metrics.netMins) : '—'}
                          </td>
                          {/* SEPARATE OVERTIME COLUMN */}
                          <td className="py-3 px-3 font-mono font-bold bg-amber-50/50 dark:bg-amber-950/30 text-amber-600 dark:text-amber-400">
                            {metrics.overtimeMins > 0 ? `+${formatMinutesToHuman(metrics.overtimeMins)}` : '0m'}
                          </td>
                          {/* SEPARATE SHORT HOURS COLUMN */}
                          <td className="py-3 px-3 font-mono font-semibold text-rose-600 dark:text-rose-400">
                            {metrics.shortMins > 0 ? `-${formatMinutesToHuman(metrics.shortMins)}` : '0m'}
                          </td>
                          <td className="py-3 px-3">
                            <span className={`px-2 py-0.5 rounded text-[11px] font-semibold ${metrics.complianceClass}`}>
                              {metrics.status === 'COMPLETED' ? metrics.shiftCompliance : metrics.statusLabel}
                            </span>
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* CHECK-IN POPUP MODAL (Supports Morning School Arrivals 8:30, 9:00, 9:30 AM + Shift Target) */}
          {checkInModalEmployee && (
            <CheckInLocationModal
              employee={checkInModalEmployee}
              officeGeo={officeGeo}
              liveTime={liveTime}
              onClose={() => setCheckInModalEmployee(null)}
              onConfirm={handleConfirmCheckIn}
            />
          )}

          {/* CHECK-OUT POPUP MODAL ("Jo time pe jana chahe" - Flexible Departure Time & Live Overtime Preview) */}
          {checkOutModalEmployee && (
            <CheckOutModal
              employee={checkOutModalEmployee}
              record={(attendanceData[currentDateStr] || {})[checkOutModalEmployee.id] || {}}
              liveTime={liveTime}
              officeGeo={officeGeo}
              onClose={() => setCheckOutModalEmployee(null)}
              onConfirm={(customOutTime) => handleConfirmPunchOut(checkOutModalEmployee.id, customOutTime)}
            />
          )}

          {/* INDIVIDUAL LOGOUT POPUP MODAL (Shows Total Hours, Separate Overtime & Deficit) */}
          {justLoggedOutSummary && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 transform transition-all">
                <div className="text-center">
                  <div className="w-16 h-16 rounded-2xl bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 mx-auto flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-4">
                    <Icons.CheckCircle className="w-9 h-9" />
                  </div>
                  <h3 className="text-xl font-extrabold text-slate-900 dark:text-white">
                    {justLoggedOutSummary.employee.name} Logged Out Successfully!
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Role: <span className="font-semibold">{justLoggedOutSummary.employee.role}</span> &bull; {new Date(currentDateStr + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' })}
                  </p>
                </div>

                {/* Big Net Work Duration Highlight */}
                <div className="mt-5 bg-gradient-to-br from-indigo-500 to-indigo-700 text-white rounded-2xl p-4 text-center shadow-md">
                  <div className="text-xs font-semibold uppercase tracking-wider text-indigo-100">
                    Total Net Working Time
                  </div>
                  <div className="text-3xl font-mono font-extrabold mt-1">
                    {formatMinutesToDetailed(justLoggedOutSummary.netMins)}
                  </div>
                  <div className="mt-1 text-xs text-indigo-200 font-medium">
                    Shift Target: 7h 45m &bull; Status: {justLoggedOutSummary.shiftCompliance}
                  </div>
                </div>

                {/* SEPARATE OVERTIME GOLD HIGHLIGHT (If Overtime Worked) */}
                {justLoggedOutSummary.overtimeMins > 0 && (
                  <div className="mt-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl p-3.5 text-center shadow-md ot-glow">
                    <div className="text-[11px] font-bold uppercase tracking-wider text-amber-100 flex items-center justify-center gap-1.5">
                      <Icons.Star className="w-4 h-4 text-amber-200" />
                      <span>Extra Overtime Worked (OT)</span>
                    </div>
                    <div className="text-2xl font-mono font-extrabold mt-0.5">
                      +{formatMinutesToDetailed(justLoggedOutSummary.overtimeMins)}
                    </div>
                    <p className="text-[10px] text-amber-100 mt-0.5">
                      Extra hours logged beyond shift target. Well done!
                    </p>
                  </div>
                )}

                {/* Details Breakdown */}
                <div className="mt-4 bg-slate-50 dark:bg-slate-800/60 rounded-xl p-3.5 space-y-2 text-xs">
                  <div className="flex justify-between">
                    <span className="text-slate-500">Check-In Time:</span>
                    <span className="font-mono font-bold text-slate-800 dark:text-slate-200">{justLoggedOutSummary.inTime}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Shift Target Check-Out:</span>
                    <span className="font-mono font-bold text-indigo-600 dark:text-indigo-400">{justLoggedOutSummary.expectedOutStr}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Actual Check-Out Time:</span>
                    <span className="font-mono font-bold text-slate-800 dark:text-slate-200">{justLoggedOutSummary.outTime}</span>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-slate-500">Lunch Break Duration:</span>
                    <span className="font-mono text-slate-700 dark:text-slate-300">
                      {justLoggedOutSummary.lunchDurationMins} mins
                    </span>
                  </div>
                  <div className="flex justify-between border-t border-slate-200 dark:border-slate-700 pt-2">
                    <span className="text-slate-500">Gross Office Span:</span>
                    <span className="font-mono font-medium">{formatMinutesToHuman(justLoggedOutSummary.grossMins)}</span>
                  </div>
                </div>

                <div className="mt-6">
                  <button
                    onClick={() => setJustLoggedOutSummary(null)}
                    className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition-all"
                  >
                    Done & Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CELEBRATION MODAL WHEN ALL STAFF LOGGED OUT */}
          {showAllLoggedOutModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-indigo-200 dark:border-indigo-900 text-center">
                <div className="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-400 via-orange-500 to-rose-500 text-white mx-auto flex items-center justify-center shadow-xl shadow-orange-500/30 mb-4 animate-bounce">
                  <Icons.Sparkles className="w-10 h-10" />
                </div>
                <h3 className="text-2xl font-extrabold text-slate-900 dark:text-white">
                  All {employees.length} Staff Members Have Checked Out!
                </h3>
                <p className="text-sm text-slate-500 dark:text-slate-400 mt-2">
                  All robotics team members have concluded their shifts today. Total Overtime earned: <strong className="text-amber-600">+{formatMinutesToHuman(totalOvertimeToday)}</strong>. Overall PDF summary is ready.
                </p>

                <div className="mt-6 flex flex-col sm:flex-row gap-3">
                  <button

            <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '12px' }}>
